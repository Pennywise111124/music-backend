server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/musicapp}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000        # 15 phút
  refresh-token-expiration-ms: 604800000    # 7 ngày

app:
  storage:
    upload-dir: uploads


  
