server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/musicapp
    username: postgres
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

# jwt.secret lấy từ biến môi trường JWT_SECRET (bắt buộc phải set trước khi chạy app).
# Secret phải dài >= 32 ký tự (256 bit) — HS256 sẽ throw WeakKeyException nếu ngắn hơn.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000        # 15 phút
  refresh-token-expiration-ms: 604800000    # 7 ngày

app:
  storage:
    upload-dir: uploads


  
